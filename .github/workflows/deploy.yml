name: Deploy Slidev
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/slides/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/slides
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs/slides/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Slidev（产品文档）
        run: npm run build

      - name: Build Slidev（答辩 deck）
        run: npm run build:defense

      - name: 合并答辩 deck 到同一份 Pages 产物
        run: |
          mkdir -p dist/defense
          cp -r dist-defense/. dist/defense/

      - name: 生成深链接目录（/12、/defense/24 这类地址可直达）
        run: |
          for n in $(seq 1 60); do
            mkdir -p "dist/$n" "dist/defense/$n"
            cp dist/index.html "dist/$n/index.html"
            cp dist-defense/index.html "dist/defense/$n/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
