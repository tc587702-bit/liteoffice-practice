name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  smoke:
    # 在 GitHub 的全新 Ubuntu 机器上从零跑一次，证明"别人也能跑"。
    # 本项目前端零构建、零依赖，所以 CI 只做三件事：
    #   1. 所有 .js 语法检查（node --check）
    #   2. 起静态服务器，确认首页和关键资源可访问
    #   3. 检查提交里没有混进产物/大文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS 语法检查
        run: |
          set -e
          find code/frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "所有 JS 文件语法通过"

      - name: 首页可访问（冒烟测试）
        run: |
          set -e
          python3 -m http.server 5191 --directory code/frontend &
          sleep 1
          curl -fsS http://127.0.0.1:5191/ | grep -q 'LiteOffice'
          curl -fsS http://127.0.0.1:5191/js/main.js > /dev/null
          curl -fsS http://127.0.0.1:5191/styles/app.css > /dev/null
          echo "静态资源全部可访问"

      - name: 确认没有产物混进仓库
        run: |
          set -e
          if git ls-files | grep -qE '^(node_modules|code/frontend/public/editor)/'; then
            echo "产物被提交了，请检查 .gitignore"; exit 1
          fi
          echo "仓库干净"
